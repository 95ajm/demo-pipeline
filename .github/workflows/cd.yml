name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values.yaml
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" \
            helm/demo-pipeline/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/demo-pipeline/values.yaml
          git diff --staged --quiet || \
            git commit -m "cd: update image tag to ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main

      - name: ArgoCD sync
        run: |
          echo "ArgoCD automated sync policy handles deployment."
          echo "The commit above triggers ArgoCD reconciliation loop."
          echo ""
          echo "In production with a remote cluster this step could do something like:"
          echo "  argocd app sync demo-pipeline"
          echo "  argocd app wait demo-pipeline --health --timeout 120"

      - name: Write deployment summary
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| values.yaml | helm/demo-pipeline/values.yaml |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by CI run | ${{ github.event.workflow_run.html_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD sync | automated via sync policy |" >> $GITHUB_STEP_SUMMARY