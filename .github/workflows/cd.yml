name: CD

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values.yaml
        run: |
          sed -i "s/tag: .*/tag: \"${{ inputs.image-tag }}\"/" \
            helm/demo-pipeline/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/demo-pipeline/values.yaml
          git diff --staged --quiet || \
            git commit -m "cd: update image tag to ${{ inputs.image-tag }} [skip ci]"
          git push

      - name: ArgoCD sync
        run: |
          echo "ArgoCD automated sync policy handles deployment."
          echo "The commit above triggers ArgoCD reconciliation loop."
          echo ""
          echo "In production with a remote cluster this step would:"
          echo "  argocd login <server> --auth-token <token> --insecure"
          echo "  argocd app sync demo-pipeline"
          echo "  argocd app wait demo-pipeline --health --timeout 120"

      - name: Write deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ inputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| values.yaml updated | helm/demo-pipeline/values.yaml |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD sync | automated via sync policy |" >> $GITHUB_STEP_SUMMARY