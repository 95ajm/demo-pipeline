name: Build

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      image-tag:
        description: "The image tag built and pushed to GHCR"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      # Builds on every PR
      # Login and push to GHCR only occur on merge to main via workflow_call.
      # For QA testing, PR builds could push to a separate container registry
      # for consumption before merge, reserving GHCR for production-ready builds.
      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/demo-pipeline:${{ github.sha }} \
            ./app

      - name: Log in to GHCR
        if: github.event_name == 'workflow_call'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push image to GHCR
        if: github.event_name == 'workflow_call'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/demo-pipeline:${{ github.sha }}

      - name: Write build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ github.repository_owner }}/demo-pipeline:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY