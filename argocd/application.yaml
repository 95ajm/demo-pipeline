apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-pipeline
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/95ajm/demo-pipeline
    targetRevision: main
    path: helm/demo-pipeline
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true